name: release-win-x64

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  APP_PROJECT_PATH: src/ApixPress.App/ApixPress.App.csproj
  SC_PUBLISH_DIR: publish/win-x64/selfcontained
  SC_PACKAGE_NAME: ApixPress-selfcontained-win-x64.zip
  FW_PUBLISH_DIR: publish/win-x64/framework
  FW_PACKAGE_NAME: ApixPress-framework-win-x64.zip
  MANIFEST_NAME: versions.json

jobs:
  publish-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve release metadata
        id: release_meta
        shell: pwsh
        run: |
          # 日历版本 yyyy.M.<run_number>（如 2026.9.16）：run_number 随每次推送严格递增，
          # 跨月/跨年由日期段自然进位，整体单调；同时与旧时间戳版本（2026.9.15.10）同段可比，
          # 旧客户端可正常收到 2026.9.16+ 的更新
          $stamp = (Get-Date).ToUniversalTime().ToString("yyyy.M")
          $version = "$stamp.${{ github.run_number }}"

          $timestamp = Get-Date -Format "yyyyMMdd-HHmmss"
          # version 已随 run_number 唯一递增，tag 无需再拼时间戳与 sha
          $tag = "v$version"
          $releaseName = "ApixPress $version ($timestamp)"
          $scPackagePath = Join-Path "${{ github.workspace }}" "${{ env.SC_PACKAGE_NAME }}"
          $fwPackagePath = Join-Path "${{ github.workspace }}" "${{ env.FW_PACKAGE_NAME }}"
          $manifestPath = Join-Path "${{ github.workspace }}" "${{ env.MANIFEST_NAME }}"
          $scPackageUrl = "https://github.com/${{ github.repository }}/releases/latest/download/${{ env.SC_PACKAGE_NAME }}"
          $fwPackageUrl = "https://github.com/${{ github.repository }}/releases/latest/download/${{ env.FW_PACKAGE_NAME }}"
          $manifestUrl = "https://github.com/${{ github.repository }}/releases/latest/download/${{ env.MANIFEST_NAME }}"

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag_name=$tag" >> $env:GITHUB_OUTPUT
          "release_name=$releaseName" >> $env:GITHUB_OUTPUT
          "sc_package_path=$scPackagePath" >> $env:GITHUB_OUTPUT
          "fw_package_path=$fwPackagePath" >> $env:GITHUB_OUTPUT
          "manifest_path=$manifestPath" >> $env:GITHUB_OUTPUT
          "sc_package_url=$scPackageUrl" >> $env:GITHUB_OUTPUT
          "fw_package_url=$fwPackageUrl" >> $env:GITHUB_OUTPUT
          "manifest_url=$manifestUrl" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore ${{ env.APP_PROJECT_PATH }}

      - name: Publish self-contained app
        shell: pwsh
        run: |
          $version = "${{ steps.release_meta.outputs.version }}"

          if (Test-Path "${{ env.SC_PUBLISH_DIR }}") {
            Remove-Item "${{ env.SC_PUBLISH_DIR }}" -Recurse -Force
          }

          dotnet publish "${{ env.APP_PROJECT_PATH }}" `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o "${{ env.SC_PUBLISH_DIR }}" `
            -p:ApixPressVersionDate=$version `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishAot=false `
            -p:PublishTrimmed=false `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:InformationalVersion=$version `
            -p:Version=$version

      - name: Publish framework-dependent app
        shell: pwsh
        run: |
          $version = "${{ steps.release_meta.outputs.version }}"

          if (Test-Path "${{ env.FW_PUBLISH_DIR }}") {
            Remove-Item "${{ env.FW_PUBLISH_DIR }}" -Recurse -Force
          }

          dotnet publish "${{ env.APP_PROJECT_PATH }}" `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -o "${{ env.FW_PUBLISH_DIR }}" `
            -p:ApixPressVersionDate=$version `
            -p:PublishAot=false `
            -p:PublishTrimmed=false `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:InformationalVersion=$version `
            -p:Version=$version

      - name: Build packages and manifest
        shell: pwsh
        run: |
          $scPackagePath = "${{ steps.release_meta.outputs.sc_package_path }}"
          $fwPackagePath = "${{ steps.release_meta.outputs.fw_package_path }}"
          $manifestPath = "${{ steps.release_meta.outputs.manifest_path }}"

          foreach ($publishDir in @("${{ env.SC_PUBLISH_DIR }}", "${{ env.FW_PUBLISH_DIR }}")) {
            Get-ChildItem -Path $publishDir -Filter *.pdb -File -Recurse | Remove-Item -Force
          }

          Compress-Archive -Path "${{ env.SC_PUBLISH_DIR }}\*" -DestinationPath $scPackagePath -Force
          Compress-Archive -Path "${{ env.FW_PUBLISH_DIR }}\*" -DestinationPath $fwPackagePath -Force

          $scHash = (Get-FileHash -LiteralPath $scPackagePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $fwHash = (Get-FileHash -LiteralPath $fwPackagePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $pubTime = (Get-Date).ToUniversalTime().ToString("o")
          # 同一版本两包：自包含在前作为默认下载；应用更新服务取 Url 字段下载，PacketName 仅作展示
          $manifest = @(
            [ordered]@{
              PacketName = [System.IO.Path]::GetFileName($scPackagePath)
              Hash = $scHash
              Version = "${{ steps.release_meta.outputs.version }}"
              Url = "${{ steps.release_meta.outputs.sc_package_url }}"
              PubTime = $pubTime
            }
            [ordered]@{
              PacketName = [System.IO.Path]::GetFileName($fwPackagePath)
              Hash = $fwHash
              Version = "${{ steps.release_meta.outputs.version }}"
              Url = "${{ steps.release_meta.outputs.fw_package_url }}"
              PubTime = $pubTime
            }
          ) | ConvertTo-Json -Depth 5 -AsArray

          Set-Content -LiteralPath $manifestPath -Value $manifest -Encoding UTF8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApixPress-win-x64-release
          path: |
            ${{ steps.release_meta.outputs.sc_package_path }}
            ${{ steps.release_meta.outputs.fw_package_path }}
            ${{ steps.release_meta.outputs.manifest_path }}
          retention-days: 30

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          files: |
            ${{ steps.release_meta.outputs.sc_package_path }}
            ${{ steps.release_meta.outputs.fw_package_path }}
            ${{ steps.release_meta.outputs.manifest_path }}
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
