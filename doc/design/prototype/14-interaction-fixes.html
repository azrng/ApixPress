<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ApixPress · 交互修复确认</title><link rel="stylesheet" href="shared.css"></head>
<body><main class="card" style="max-width:960px;margin:32px auto;padding:32px;">
<h1 style="margin-bottom:16px;">交互修复确认</h1><p style="color:var(--text-secondary);margin-bottom:24px;">沿用现有工作台与设计 token。下列页面均使用模拟数据，可直接操作。</p>
<ol style="padding-left:24px;line-height:2.4;">
<li><a href="02-debug-params.html" style="color:var(--accent);">请求调试</a>：搜索 name，检查高亮、匹配计数与上下项；关闭接口标签，再从「所有标签」恢复。</li>
<li><a href="13-quick-request.html" style="color:var(--accent);">快捷请求</a>：输入错误 URL 或空名称，检查字段旁错误；首次保存后再次保存直接更新，「另存为」独立命名。</li>
<li><a href="05-history.html" style="color:var(--accent);">历史记录</a>：使用 Tab 聚焦行内按钮，检查操作始终可见。</li>
<li><a href="04-debug-headers-error.html" style="color:var(--accent);">异常响应</a>：检查错误响应中搜索定位与既有重试流程并存。</li>
</ol><p style="margin-top:24px;color:var(--text-secondary);">恢复仅限当前打开项目的会话，最多保留 10 个标签；关闭项目或退出应用后不保留草稿。跨重启草稿恢复另行设计。</p>
</main></body></html>
