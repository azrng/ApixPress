<div id="apixpress-upload-prototype">
  <style>
    #apixpress-upload-prototype { color: light-dark(#20242b, #f3f5f7); font-family: "Segoe UI", sans-serif; }
    #apixpress-upload-prototype .shell { background: light-dark(#f6f8fb, #171b22); border: 1px solid light-dark(#d9dee7, #3b4452); border-radius: 8px; overflow: hidden; }
    #apixpress-upload-prototype .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; background: light-dark(#ffffff, #202630); border-bottom: 1px solid light-dark(#d9dee7, #3b4452); }
    #apixpress-upload-prototype .title { font-weight: 600; }
    #apixpress-upload-prototype .state { color: light-dark(#607085, #aeb9c8); font-size: 13px; }
    #apixpress-upload-prototype .tabs { display: flex; gap: 18px; padding: 0 16px; background: light-dark(#ffffff, #202630); }
    #apixpress-upload-prototype .tab { padding: 11px 0 9px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: inherit; cursor: pointer; }
    #apixpress-upload-prototype .tab.active { border-color: #2787f5; color: #2787f5; font-weight: 600; }
    #apixpress-upload-prototype .content { padding: 16px; }
    #apixpress-upload-prototype .table { width: 100%; border-collapse: collapse; font-size: 14px; }
    #apixpress-upload-prototype th { text-align: left; color: light-dark(#607085, #aeb9c8); font-weight: 500; padding: 0 8px 8px; }
    #apixpress-upload-prototype td { padding: 8px; vertical-align: middle; border-top: 1px solid light-dark(#e4e8ee, #333c49); }
    #apixpress-upload-prototype input[type="text"] { width: 100%; box-sizing: border-box; min-height: 32px; border: 1px solid light-dark(#cbd3df, #4b5768); border-radius: 4px; background: light-dark(#ffffff, #151a21); color: inherit; padding: 6px 8px; }
    #apixpress-upload-prototype select { min-height: 32px; border: 1px solid light-dark(#cbd3df, #4b5768); border-radius: 4px; background: light-dark(#ffffff, #151a21); color: inherit; padding: 4px; }
    #apixpress-upload-prototype .file-summary { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 205px; min-height: 32px; border: 1px dashed light-dark(#9eabc0, #65738a); border-radius: 4px; padding: 0 8px; color: light-dark(#445165, #d4dbe5); }
    #apixpress-upload-prototype .text-field { display: none; }
    #apixpress-upload-prototype .button { min-height: 32px; border: 1px solid light-dark(#cbd3df, #4b5768); border-radius: 4px; padding: 5px 10px; background: light-dark(#ffffff, #2a323e); color: inherit; cursor: pointer; }
    #apixpress-upload-prototype .button.primary { background: #2787f5; border-color: #2787f5; color: white; }
    #apixpress-upload-prototype .button.danger { color: #d04a4a; }
    #apixpress-upload-prototype .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    #apixpress-upload-prototype .response { margin-top: 16px; padding: 14px 16px; border-top: 1px solid light-dark(#d9dee7, #3b4452); background: light-dark(#ffffff, #202630); }
    #apixpress-upload-prototype .progress { display: none; align-items: center; gap: 10px; color: light-dark(#405068, #d7e0ec); }
    #apixpress-upload-prototype .progress.visible { display: flex; }
    #apixpress-upload-prototype .progress-bar { flex: 1; height: 5px; overflow: hidden; background: light-dark(#e3e9f2, #384454); border-radius: 3px; }
    #apixpress-upload-prototype .progress-bar span { display: block; width: 62%; height: 100%; background: #2787f5; }
    #apixpress-upload-prototype .notice { margin: 0; color: light-dark(#607085, #aeb9c8); font-size: 13px; }
    #apixpress-upload-prototype .busy .content { opacity: .55; pointer-events: none; }
    @media (max-width: 620px) { #apixpress-upload-prototype th:nth-child(4), #apixpress-upload-prototype td:nth-child(4) { display: none; } #apixpress-upload-prototype .bar { align-items: flex-start; flex-direction: column; } }
  </style>
  <div class="shell">
    <div class="bar"><div class="title">上传附件接口</div><div class="state" id="state">编辑请求</div></div>
    <div class="tabs"><button type="button" class="tab">Params</button><button type="button" class="tab active">Body</button><button type="button" class="tab">Headers</button></div>
    <div class="content">
      <table class="table" aria-label="multipart 表单字段">
        <thead><tr><th>启用</th><th>字段名</th><th>字段值 / 文件</th><th>类型</th><th>操作</th></tr></thead>
        <tbody><tr>
          <td><input type="checkbox" checked aria-label="启用附件字段"></td>
          <td><input type="text" value="attachments" aria-label="字段名"></td>
          <td><div class="file-summary" id="file-summary"><span id="file-label">已选择 3 个文件</span><button type="button" class="button" id="choose">选择文件</button></div><input class="text-field" type="text" value="" aria-label="字段值"></td>
          <td><select id="field-type" aria-label="字段类型"><option value="file" selected>文件</option><option value="text">文本</option></select></td>
          <td><button type="button" class="button danger" id="clear">清除</button></td>
        </tr></tbody>
      </table>
      <div class="actions"><button type="button" class="button" id="save">保存</button><button type="button" class="button primary" id="send">发送</button></div>
    </div>
    <div class="response"><div class="progress" id="progress"><div class="progress-bar"><span></span></div><span>正在上传 3 个文件</span><button type="button" class="button danger" id="cancel">取消请求</button></div><p class="notice" id="response-text">文件字段支持一次选择多个文件；同名 multipart 字段会按选择顺序发送。</p></div>
  </div>
  <script>
    (() => {
      const root = document.getElementById('apixpress-upload-prototype');
      const type = root.querySelector('#field-type');
      const summary = root.querySelector('#file-summary');
      const textField = root.querySelector('.text-field');
      const label = root.querySelector('#file-label');
      const send = root.querySelector('#send');
      const cancel = root.querySelector('#cancel');
      const progress = root.querySelector('#progress');
      const state = root.querySelector('#state');
      const response = root.querySelector('#response-text');
      type.addEventListener('change', () => { const file = type.value === 'file'; summary.style.display = file ? 'flex' : 'none'; textField.style.display = file ? 'none' : 'block'; label.textContent = '已选择 3 个文件'; });
      root.querySelector('#choose').addEventListener('click', () => { label.textContent = '已选择 3 个文件'; response.textContent = '选择器返回的文件只在发送时读取，不会被复制到项目目录。'; });
      root.querySelector('#clear').addEventListener('click', () => { label.textContent = '未选择文件'; response.textContent = '文件字段将不会出现在本次 multipart 请求中。'; });
      send.addEventListener('click', () => { root.classList.add('busy'); progress.classList.add('visible'); state.textContent = '正在发送'; response.textContent = '请求快照已固定，编辑控件暂时锁定。'; });
      cancel.addEventListener('click', () => { root.classList.remove('busy'); progress.classList.remove('visible'); state.textContent = '已取消'; response.textContent = '上传已取消，可调整字段后重新发送。'; });
    })();
  </script>
</div>
